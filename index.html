<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans Bengali",sans-serif;transition:background .2s,color .2s}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;background:var(--panel);z-index:10;box-shadow:0 2px 12px rgba(40,65,95,.04)}
h1{font-size:19px;margin:0;letter-spacing:.5px}small,.muted{color:var(--muted)}button,input,select{font:inherit}button{background:var(--accent);color:var(--accentText);border:0;padding:9px 13px;border-radius:10px;font-weight:650;cursor:pointer}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.danger{background:#b65e68;color:white}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 30%,transparent);outline-offset:2px}
.header-actions{display:flex;align-items:center;gap:8px}.menu-wrap{position:relative}.dots{width:42px;height:42px;padding:0;font-size:23px;line-height:1;background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.menu{position:absolute;right:0;top:48px;width:230px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow);display:none;z-index:20}.menu.open{display:block}.menu button{display:block;width:100%;text-align:left;margin:3px 0;background:transparent;color:var(--text);font-weight:550}.menu button:hover{background:var(--panel2)}
.layout{min-height:calc(100vh - 67px)}main{padding:24px;max-width:1150px;width:100%;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow)}.card h3{margin:0 0 8px}.big{font-size:29px;font-weight:800;letter-spacing:-.5px}.bar{height:9px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:9px 0}.bar>i{display:block;height:100%;background:var(--green);width:0;border-radius:99px;transition:width .25s}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.crumb{color:var(--muted);margin-bottom:15px;font-size:14px}.crumb span{cursor:pointer;color:var(--accent)}.list{display:grid;gap:9px}.item{background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:13px;box-shadow:var(--shadow)}.item button{padding:7px 10px}.pill{font-size:12px;border:1px solid var(--line);border-radius:30px;padding:4px 9px;color:var(--muted);white-space:nowrap}
.task{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{width:18px;height:18px;accent-color:var(--green);flex:none}.done{text-decoration:line-through;color:var(--muted)}.task b{margin-left:auto;white-space:nowrap;color:var(--muted);font-size:13px}
input[type=text],input[type=time],input[type=number],select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px;border-radius:9px;width:100%}
.add{display:flex;gap:8px;margin-top:12px}.add input{flex:1}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}.routine-row{display:grid;grid-template-columns:1.2fr 1fr 1fr .7fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.daychips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.daychips label{background:var(--panel2);padding:7px 10px;border-radius:9px;font-size:13px}
footer{color:var(--muted);font-size:12px;margin-top:25px}.section-title{margin:24px 0 12px}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
@media(max-width:650px){main{padding:15px}.routine-row{grid-template-columns:1fr 1fr}.routine-row button{grid-column:2}.two-col{grid-template-columns:1fr}header{padding:12px 14px}.header-actions .secondary{padding:8px 10px}}

function seedFullSyllabus() {
  let added=0, unmatched=[];
  data.forEach(s=>s.papers.forEach(p=>{
    const entries=Object.entries(fullSyllabusTopics).filter(([key])=>{
      const bits=key.split("|"); return bits[0]===s.subject && bits[1]===p.paper;
    });
    p.chapters.forEach((ch,ci)=>{
      const topics=entries[ci] ? entries[ci][1] : null;
      if(topics && (!ch.topics || ch.topics.length===0)) {
        ch.topics=topics.map(name=>({name,tasks:weights[s.subject].map(([task,weight])=>({name:task,weight,done:false}))}));
        added+=topics.length;
      } else if(!topics) unmatched.push(s.subject+" / "+p.paper+" / "+ch.name);
    });
  }));
  save(); return {added,unmatched};
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function chapterProgress(ch){let ts=ch.topics||[];if(!ts.length)return 0;return ts.reduce((a,t)=>a+topicProgress(t),0)/ts.length;}
function topicProgress(t){return (t.tasks||[]).filter(x=>x.done).reduce((a,x)=>a+x.weight,0);}
function subjectProgress(s){let a=s.papers.flatMap(p=>p.chapters);return a.length?a.reduce((v,c)=>v+chapterProgress(c),0)/a.length:0;}
function allProgress(){let a=data.flatMap(s=>s.papers.flatMap(p=>p.chapters));return a.length?a.reduce((v,c)=>v+chapterProgress(c),0)/a.length:0;}
function setPage(next,push=true){if(push)trail.push({...view});view={...view,...next};if(push)history.pushState({navil:true},"","#"+view.page);render();}

function insights(){let days=[...Array(7)].map((_,i)=>{let d=dayStr(6-i);return{d:d.slice(5),m:(S.log[d]||{m:0}).m}}),mx=Math.max(S.goal,...days.map(x=>x.m)),sub={};
Object.values(S.log).forEach(L=>Object.entries(L.s||{}).forEach(([k,v])=>sub[k]=(sub[k]||0)+v));let P=allProgress(),R=52,C=2*Math.PI*R;
return `${crumb("Insights")}<h2>📊 Insights</h2><div class="grid"><div class="card" style="text-align:center"><svg width="130" height="130" viewBox="0 0 130 130"><circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--panel2)" stroke-width="12"/><circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--green)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*P/100} ${C}" transform="rotate(-90 65 65)"/><text x="65" y="72" text-anchor="middle" font-size="22" font-weight="800" fill="var(--text)">${P.toFixed(0)}%</text></svg><div><small>Overall progress</small></div></div><div class="card"><h3>গত ৭ দিন (মিনিট)</h3><div style="display:flex;align-items:flex-end;gap:6px;height:120px">${days.map(x=>`<div style="flex:1;text-align:center"><div style="height:${x.m/mx*80}px;min-height:2px;background:var(--accent);border-radius:5px"></div><small style="font-size:10px">${x.m}<br>${x.d}</small></div>`).join("")}</div></div></div><h3 class="section-title">Subject-wise পড়ার সময়</h3><div class="card">${Object.entries(sub).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${Math.floor(v/60)}h ${v%60}m</b></div>`).join("")||"<small>এখনো কোনো timer session নেই।</small>"}</div><h3 class="section-title">Chapter heatmap</h3>${data.map(s=>`<div class="card" style="margin-bottom:10px"><b>${esc(s.subject)}</b><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px">${s.papers.flatMap(p=>p.chapters).map(c=>`<div title="${esc(c.name)}: ${chapterProgress(c).toFixed(0)}%" style="width:22px;height:22px;border-radius:5px;background:color-mix(in srgb,var(--green) ${Math.max(8,chapterProgress(c))}%,var(--panel2))"></div>`).join("")}</div></div>`).join("")}`}
function settingsX(){return `<div class="card" style="margin-top:14px"><h3>Study goal ও Exam</h3><div class="two-col"><label>দৈনিক লক্ষ্য (মিনিট)<input type="number" min="10" value="${S.goal}" onchange="S.goal=Math.max(10,+this.value||60);saveS()"></label><label>Exam-এর নাম<input type="text" value="${esc(S.exam.name)}" onchange="S.exam.name=this.value;saveS()"></label><label>Exam-এর তারিখ<input type="date" value="${S.exam.date}" onchange="S.exam.date=this.value;saveS()"></label></div></div>`}
/* ===== Routine Maker v2 ===== */
let RM={si:0,pi:0,ci:0,sel:new Set(),date:"",start:"08:00",dur:30,gap:5};
const fd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const planned=()=>new Set(routines.filter(r=>!r.done&&r.id).map(r=>r.id));
function rmSet(k,v){RM[k]=+v;if(k==="si"){RM.pi=0;RM.ci=0}if(k==="pi")RM.ci=0;render()}
function rmField(k,v){RM[k]=v}
function rmTog(id,on){on?RM.sel.add(id):RM.sel.delete(id);render()}
function rmChap(ti){let c=data[RM.si].papers[RM.pi].chapters[RM.ci],pl=planned(),ids=[];c.topics.forEach((t,i)=>{if(ti!==undefined&&i!==ti)return;t.tasks.forEach((k,j)=>{let id=[RM.si,RM.pi,RM.ci,i,j].join("|");if(!k.done&&!pl.has(id))ids.push(id)})});let all=ids.length&&ids.every(id=>RM.sel.has(id));ids.forEach(id=>all?RM.sel.delete(id):RM.sel.add(id));render()}
function rmClear(){RM.sel.clear();render()}
function rmAdd(){if(!RM.sel.size){alert("আগে কিছু task বেছে নিন।");return}
let date=RM.date||today(),n=0;
[...RM.sel].sort((a,b)=>{let x=a.split("|").map(Number),y=b.split("|").map(Number);for(let i=0;i<5;i++)if(x[i]!==y[i])return x[i]-y[i];return 0}).forEach(id=>{
let [si,pi,ci,ti,ki]=id.split("|").map(Number),s=data[si],p=s.papers[pi],c=p.chapters[ci],t=c.topics[ti],k=t.tasks[ki];if(k.done||routines.some(r=>r.id===id&&!r.done))return;
routines.push({id,title:`${s.subject} · ${p.paper} · ${c.name} · ${t.name} · ${k.name}`,date,start:"",duration:0,done:false});n++});
RM.sel.clear();saveRoutine();render();alert(n+"টি task routine-এ যোগ হয়েছে।")}
function rmPurge(){routines=routines.filter(r=>!r.done);saveRoutine();render()}
function routineX(){let s=data[RM.si],p=s.papers[RM.pi],c=p.chapters[RM.ci],pl=planned(),
opt=(a,f,sel)=>a.map((x,i)=>`<option value="${i}" ${i===sel?"selected":""}>${esc(f(x,i))}</option>`).join("");
let tl=c.topics.map((t,ti)=>`<div class="item"><div class="row"><b>${esc(t.name)}</b><button class="secondary" onclick="rmChap(${ti})">সব বাছুন / বাদ</button></div>${t.tasks.map((k,ki)=>{let id=[RM.si,RM.pi,RM.ci,ti,ki].join("|"),dis=k.done||pl.has(id);return `<label class="task"><input type="checkbox" ${RM.sel.has(id)?"checked":""} ${dis?"disabled":""} onchange="rmTog('${id}',this.checked)"><span class="${k.done?"done":""}">${esc(k.name)}</span><b>${k.done?"✔ শেষ":pl.has(id)?"Routine-এ আছে":k.weight+"%"}</b></label>`}).join("")}</div>`).join("")||'<div class="empty">এই chapter-এ কোনো topic নেই।</div>';
let idx=routines.map((r,i)=>i).sort((a,b)=>((routines[a].date||"")+(routines[a].start||"")).localeCompare((routines[b].date||"")+(routines[b].start||""))),last="",t0=today();
let pr=idx.map(i=>{let r=routines[i],h="";if(r.date!==last){last=r.date;h=`<div class="section-title" style="margin:12px 0 2px">${esc(r.date||"তারিখ নেই")}${r.date===t0?" · আজ":""}</div>`}
return h+`<div class="task"><input type="checkbox" ${r.done?"checked":""} onchange="completeRoutine(${i},this.checked)"><span class="${r.done?"done":""}">${esc(r.title)}</span><b>${r.start?esc(r.start)+" · "+(r.duration||0)+"m":""}</b><button class="danger" onclick="deleteRoutine(${i})">×</button></div>`}).join("");
return `${crumb("Routine maker")}<h2>Routine Maker</h2><p class="muted">Subject → Paper → Chapter বেছে topic/task টিক দিন। বিভিন্ন chapter থেকেও বেছে একসাথে যোগ করা যাবে।</p>
<div class="card"><h3>১. কোথা থেকে বাছবেন</h3><div class="two-col"><label>Subject<select onchange="rmSet('si',this.value)">${opt(data,x=>x.subject,RM.si)}</select></label><label>Paper<select onchange="rmSet('pi',this.value)">${opt(s.papers,x=>x.paper,RM.pi)}</select></label></div><label style="display:block;margin-top:10px">Chapter<select onchange="rmSet('ci',this.value)">${opt(p.chapters,(x,i)=>"Ch "+(i+1)+": "+x.name,RM.ci)}</select></label><button class="secondary" style="margin-top:10px" onclick="rmChap()">এই chapter-এর সব task বাছুন / বাদ</button></div>
<h3 class="section-title">২. Topic ও task</h3><div class="list">${tl}</div>
<div class="card" style="margin-top:14px"><h3>৩. কোন দিনের routine-এ?</h3><label>তারিখ<input type="date" value="${RM.date||today()}" onchange="rmField('date',this.value)"></label></div>
<div class="card" style="position:sticky;bottom:10px;margin-top:14px;z-index:5"><div class="row"><b>${RM.sel.size}টি task বাছা হয়েছে</b><div style="display:flex;gap:8px"><button class="secondary" onclick="rmClear()">Clear</button><button onclick="rmAdd()">+ সব Add করুন</button></div></div></div>
<h3 class="section-title">Planned tasks</h3><div class="card">${pr||'<div class="empty">এখনো কোনো task plan করা হয়নি।</div>'}${routines.some(r=>r.done)?'<button class="secondary" style="margin-top:10px" onclick="rmPurge()">✔ শেষ হওয়াগুলো মুছুন</button>':""}</div>`}
/* ===== Home clock: timer + stopwatch ===== */
let CK="t",CS=0,SW={run:false,base:0,at:0,laps:[]};
const swEl=()=>SW.base+(SW.run?Date.now()-SW.at:0);
const fmtH=ms=>{let s=Math.floor(ms/1000);return String(Math.floor(s/3600)).padStart(2,"0")+":"+fmt(s%3600)};
function clockTab(k){CK=k;render()}
function swToggle(){if(SW.run){SW.base=swEl();SW.run=false}else{SW.at=Date.now();SW.run=true}render()}
function swLap(){if(swEl()>0){SW.laps.unshift(fmtH(swEl()));render()}}
function swReset(save){let m=Math.floor(swEl()/60000);if(save&&m>0)addLog(m,0,data[CS].subject);SW={run:false,base:0,at:0,laps:[]};render()}
setInterval(()=>{let b=document.getElementById("swbig");if(b)b.textContent=fmtH(swEl())},250);
function clockX(){let busy=T||SW.run,tab=(k,t)=>`<button class="${CK===k?"":"secondary"}" onclick="clockTab('${k}')">${t}</button>`,
sub=`<select id="tSub" onchange="CS=+this.value" ${busy?"disabled":""} style="margin-bottom:10px">${data.map((s,i)=>`<option value="${i}" ${i===CS?"selected":""}>${esc(s.subject)}</option>`).join("")}</select>`,b;
if(CK==="t")b=T?`<div class="big" id="tbig" style="font-size:44px;text-align:center">${fmt(T.left)}</div><div class="bar"><i style="width:${(1-T.left/T.total)*100}%"></i></div><div class="row" style="justify-content:center;gap:8px"><button onclick="pauseTimer()">${T.run?"⏸ Pause":"▶ Resume"}</button><button class="secondary" onclick="stopTimer()">⏹ Stop & save</button></div>`:
`<div class="row" style="justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:10px">${[15,25,45,60].map(m=>`<button class="secondary" onclick="document.getElementById('tMin').value=${m}">${m}m</button>`).join("")}<input id="tMin" type="number" min="1" value="25" style="width:80px"></div><div class="row" style="justify-content:center"><button onclick="startTimer()">▶ Timer শুরু</button></div>`;
else b=`<div class="big" id="swbig" style="font-size:44px;text-align:center">${fmtH(swEl())}</div><div class="row" style="justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px"><button onclick="swToggle()">${SW.run?"⏸ Pause":"▶ Start"}</button><button class="secondary" onclick="swLap()">⚑ Lap</button><button class="secondary" onclick="swReset(false)">↺ Reset</button><button class="secondary" onclick="swReset(true)">💾 Save</button></div>${SW.laps.length?`<div style="margin-top:10px;text-align:center"><small>${SW.laps.slice(0,5).map((l,i)=>"Lap "+(SW.laps.length-i)+": "+l).join("<br>")}</small></div>`:""}`;
return `<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:flex-start;gap:8px;margin-bottom:10px">${tab("t","⏱ Timer")}${tab("s","⏲ Stopwatch")}</div>${sub}${b}<small style="display:block;text-align:center;margin-top:8px">Subject বেছে নিন, সময় আজকের লক্ষ্যে যোগ হবে।</small></div>`}
const _render=render,_tt=toggleTask,_cr=completeRoutine,_bk=backup;
toggleTask=(i,v)=>{_tt(i,v);addLog(0,v?1:-1)};
completeRoutine=(i,v)=>{_cr(i,v);addLog(0,v?1:-1)};
backup=()=>{S.lastBackup=Date.now();saveS();_bk()};
render=function(){_render();let el=document.getElementById("app"),p=view.page,pill=document.getElementById("tpill");pill.style.display=T?"":"none";if(T)pill.textContent="⏱ "+fmt(T.left);
document.getElementById("menu").insertAdjacentHTML("beforeend",'<button onclick="go(\'insights\')">📊 Insights</button>');
if(p==="home"){[...el.querySelectorAll(".card")].find(c=>c.textContent.includes("Routine খুলুন"))?.remove();el.querySelector(".grid").insertAdjacentHTML("afterend",'<div style="margin-top:16px">'+homeX()+"</div>")}
else if(p==="topic")el.querySelector("footer").insertAdjacentHTML("beforebegin",topicX());
else if(p==="routine")el.innerHTML=routineX();
else if(p==="insights")el.innerHTML=insights();
else if(p==="settings")el.insertAdjacentHTML("beforeend",settingsX());};
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
