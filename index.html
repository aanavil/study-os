.qset{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}.segs{display:flex;gap:6px;margin-top:6px}.chip.on{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
label.sw{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text)}label.sw input{display:none}label.sw i{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:.2s}label.sw i:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}label.sw input:checked+i{background:var(--accent)}label.sw input:checked+i:after{left:21px}
#mot.mq{background:color-mix(in srgb,var(--accent) 9%,var(--panel));border-left:4px solid var(--accent);border-radius:14px;padding:12px 16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}

.exh.exh2{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:2px!important;padding:6px 10px!important;border-radius:12px!important;background:var(--panel2)!important;color:var(--text)!important;border:1px solid var(--line)!important;box-shadow:none!important;animation:none!important;text-align:left!important;min-width:112px;font-weight:500}
.x1{font-size:10px;color:var(--muted);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.x2{font-size:11px;white-space:nowrap}.x2 b{font-size:17px;color:var(--accent)}.exh2.hot .x2 b{color:#d9534f}
.xb{display:block;height:3px;border-radius:9px;background:var(--line);overflow:hidden}.xb i{display:block;height:100%;background:var(--accent)}.x3{font-size:9.5px;color:var(--muted);white-space:nowrap}
header>div:first-child{min-width:0}@media(max-width:560px){header>div:first-child small{display:none}}
.exhero{background:color-mix(in srgb,var(--accent) 12%,var(--panel))!important;color:var(--text)!important;border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line))}.exhero small{color:var(--muted)!important}.exbig{color:var(--accent)}
.exst{grid-template-columns:repeat(4,1fr)!important}.exst b{font-size:15px!important}.exst small{font-size:10px!important}
.brand{display:flex;align-items:center;gap:10px}.brand>div{min-width:0}.brand h1{margin:0}.lg{flex:none;height:48px;width:auto;border-radius:11px;background:#fafafa;padding:3px;box-shadow:0 0 0 1px var(--line)}

.bar.sm{height:6px;margin:4px 0 6px}.sec{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:12px}
.brk{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:12px}
.brk>div:nth-child(1) .bar>i{background:#4f8ef7!important}.brk>div:nth-child(2) .bar>i{background:#2eb872!important}.brk>div:nth-child(3) .bar>i{background:#ef8a4c!important}.brk>div:nth-child(4) .bar>i{background:#9b6fe0!important}
.mini{display:block;margin-top:6px;color:var(--muted);font-size:11px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.cp{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--muted)}.cp.y{background:color-mix(in srgb,var(--green) 24%,var(--panel2));color:var(--text);font-weight:700}
.lg{flex:none;height:50px!important;width:auto!important;border-radius:0!important;background:none!important;padding:0!important;box-shadow:none!important}
body[data-theme="midnight"] .lg,body[data-theme="forest"] .lg,body[data-theme="amoled"] .lg,body[data-theme="ocean"] .lg,body[data-theme="jade"] .lg,body[data-theme="pine"] .lg,body[data-theme="moss"] .lg,body[data-theme="mocha"] .lg,body[data-theme="plum"] .lg,body[data-theme="graphite"] .lg{background:#f3f7f1!important;border-radius:50%!important;padding:3px 2px 0!important;box-shadow:0 0 0 1px var(--line)!important}

function seedFullSyllabus() {
  let added=0, unmatched=[];
  data.forEach(s=>s.papers.forEach(p=>{
    const entries=Object.entries(fullSyllabusTopics).filter(([key])=>{
      const bits=key.split("|"); return bits[0]===s.subject && bits[1]===p.paper;
    });
    p.chapters.forEach((ch,ci)=>{
      const topics=entries[ci] ? entries[ci][1] : null;
      if(topics && (!ch.topics || ch.topics.length===0)) {
        ch.topics=topics.map(name=>({name,tasks:weights[s.subject].map(([task,weight])=>({name:task,weight,done:false}))}));
        added+=topics.length;
      } else if(!topics) unmatched.push(s.subject+" / "+p.paper+" / "+ch.name);
    });
  }));
  save(); return {added,unmatched};
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function chapterProgress(ch){let ts=ch.topics||[];if(!ts.length)return 0;return ts.reduce((a,t)=>a+topicProgress(t),0)/ts.length;}
function topicProgress(t){let g=tg(t);return Math.round((g.class+g.note+g.eng+g.var)/4*10)/10;}
function subjectProgress(s){let a=s.papers.flatMap(p=>p.chapters);return a.length?a.reduce((v,c)=>v+chapterProgress(c),0)/a.length:0;}
function allProgress(){let a=data.flatMap(s=>s.papers.flatMap(p=>p.chapters));return a.length?a.reduce((v,c)=>v+chapterProgress(c),0)/a.length:0;}
function setPage(next,push=true){if(push)trail.push({...view});view={...view,...next};if(push)history.pushState({navil:true},"","#"+view.page);render();}

dt=has?new Date(S.exam.date+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"}):"";
o.innerHTML=`<div class="sh exm"><div class="exhero"><small>${has?""+esc(S.exam.name||"Exam")+" · "+dt:"Exam countdown"}</small>${has?`<div class="exbig">${d>0?d:d===0?"আজ!":"✔"}</div><div class="exsub">${d>0?"দিন বাকি":d===0?"পরীক্ষার দিন, শুভকামনা!":"পরীক্ষা শেষ"}</div>`:'<div class="exsub" style="margin:14px 0 4px">নিচে নাম ও তারিখ দিয়ে শুরু করুন</div>'}</div>${has&&d>0?`<div class="exst"><div><b>${P.toFixed(0)}%</b><small>শেষ</small></div><div><b>${rt}</b><small>topic বাকি</small></div><div><b>~${Math.ceil(rt/d)}</b><small>topic/দিন</small></div><div><b>${hm(L.m)}</b><small>আজ পড়েছি</small></div></div><div class="bar" style="margin:0 2px 4px"><i style="width:${P}%"></i></div>`:""}<input type="text" id="mxn" placeholder="Exam-এর নাম" value="${esc(S.exam.name||"")}"><input type="date" id="mxd" value="${S.exam.date||""}"><button id="mxs">${has?"Update করুন":"Countdown শুরু করুন"}</button>${has?'<button class="secondary" id="mxr">🗑 Remove</button>':""}</div>`;
document.body.appendChild(o);
o.querySelector("#mxs").onclick=()=>{let v=o.querySelector("#mxd").value;if(!v){alert("তারিখ বাছুন।");return}S.exam={name:o.querySelector("#mxn").value.trim(),date:v};saveS();o.remove();render()};
let r=o.querySelector("#mxr");if(r)r.onclick=()=>{S.exam={name:"",date:""};saveS();o.remove();render()}}
function setMq(x){S.mqSec=x;saveS();render()}
function quotesX(){let Q=S.quotes||[];return `<div class="card qcard" style="margin-top:14px"><div class="qh"><span class="qi">💬</span><div><h3 style="margin:0">Motivational quotes</h3><small>Home-এর Welcome লাইনে ঘুরে ঘুরে দেখাবে</small></div></div><div class="qadd"><input id="qn" type="text" placeholder="নিজের quote লিখুন..."><button onclick="addQuote()">＋</button></div><div class="ql">${Q.length?Q.map((q,i)=>`<div class="qit"><span class="qm">“</span><span class="qt">${esc(q)}</span><button class="ic" onclick="delQuote(${i})">×</button></div>`).join(""):'<div class="qe">এখনো কোনো নিজের quote নেই। উপরে লিখে যোগ করুন ✨</div>'}</div><div class="qset"><div><small>বদলের বিরতি</small><div class="segs">${[5,7,10,15,30].map(x=>`<button class="chip ${(S.mqSec||7)===x?"on":""}" onclick="setMq(${x})">${x}s</button>`).join("")}</div></div><label class="sw"><input type="checkbox" ${S.mqDef===false?"":"checked"} onchange="S.mqDef=this.checked;saveS()"><i></i><span>ডিফল্ট quotes</span></label></div></div>`}
function exhRender(){let b=document.getElementById("exh");if(!b)return;let ex=S.exam;
if(!ex||!ex.date){b.className="secondary exh exh2";b.innerHTML='<span class="x1">Exam countdown</span><span class="x2"><b>Set করুন</b></span>';return}
let d=Math.ceil((new Date(ex.date+"T00:00")-new Date())/864e5),P=allProgress(),rem=100-P;b.className="secondary exh exh2"+(d>=0&&d<=7?" hot":"");
b.innerHTML=`<span class="x1">${esc(ex.name||"Exam")}</span><span class="x2"><b>${d>0?d:d===0?"আজই":"✔"}</b> ${d>0?"দিন বাকি":d===0?"পরীক্ষা":"শেষ"}</span>${d>0?`<span class="xb"><i style="width:${Math.min(100,P)}%"></i></span><span class="x3">${rem.toFixed(0)}% বাকি · দিনে ~${(rem/d).toFixed(1)}%</span>`:""}`}
/* ===== v10: new topic structure (Class, Concept Note, Engineering, Varsity) ===== */
const TL=[["Class",100],["Concept Note",100],["EQB",50],["CB",25],["PB",25],["VQB",80],["অনুশীলনী",20]];
function GN(n){return n==="Class"?"class":n==="Concept Note"?"note":(n==="EQB"||n==="CB"||n==="PB")?"eng":"var"}
function tg(t){let r={class:0,note:0,eng:0,var:0};(t.tasks||[]).forEach(x=>{if(x.done)r[GN(x.name)]+=x.weight});return r}
function grpLabel(k){let g=GN(k.name);return g==="eng"?"Engineering":g==="var"?"Varsity":g==="note"?"Note":"Class"}
function migrateV2(){let ch=false,map={Physics:{0:0,1:2,2:5,3:1},Chemistry:{0:0,1:2,2:5,3:1},"Higher Math":{0:0,1:0,2:2,3:5}};
data.forEach((s,si)=>s.papers.forEach((p,pi)=>p.chapters.forEach((c,ci)=>(c.topics||[]).forEach((t,ti)=>{
if(t.tasks&&t.tasks.length===7&&t.tasks[1].name==="Concept Note")return;
let o=t.tasks||[],old=n=>{let x=o.find(y=>y.name===n);return !!(x&&x.done)},M=s.subject==="Higher Math",cls=M?(old("Engineering class")&&old("Varsity class")):old("Class"),v={Class:cls,"Concept Note":old("Short note"),EQB:old("EQB"),VQB:old("VQB")};
t.tasks=TL0().map(([name,weight])=>({name,weight,done:!!v[name]}));ch=true;
routines.forEach(r=>{if(!r.id)return;let a=r.id.split("|").map(Number);if(a.length===5&&a[0]===si&&a[1]===pi&&a[2]===ci&&a[3]===ti&&!r.mig){let nk=(map[s.subject]||{})[a[4]];if(nk===undefined)return;a[4]=nk;r.id=a.join("|");r.title=r.title.replace(/ · [^·]*$/," · "+t.tasks[nk].name);r.mig=1}})
}))));if(ch){save();saveRoutine()}}
function aggT(ts){let n=ts.length||1,r={class:0,note:0,eng:0,var:0,all:0,cd:0,nd:0};ts.forEach(t=>{let g=tg(t);r.class+=g.class;r.note+=g.note;r.eng+=g.eng;r.var+=g.var;r.all+=topicProgress(t);if(g.class>=100)r.cd++;if(g.note>=100)r.nd++});["class","note","eng","var","all"].forEach(k=>r[k]/=n);return r}
function aggCh(cs){let n=cs.length||1,r={class:0,note:0,eng:0,var:0,all:0};cs.forEach(c=>{let a=aggT(c.topics||[]);["class","note","eng","var","all"].forEach(k=>r[k]+=a[k])});["class","note","eng","var","all"].forEach(k=>r[k]/=n);return r}
function brkX(a){return `<div class="brk">${[["Class",a.class],["Concept Note",a.note],["Engineering",a.eng],["Varsity",a.var]].map(([n,v])=>`<div><div class="row"><small>${n}</small><small><b>${v.toFixed(0)}%</b></small></div><div class="bar sm"><i style="width:${v}%"></i></div></div>`).join("")}</div>`}
const miniX=a=>`<small class="mini">Class ${a.class.toFixed(0)}% · Note ${a.note.toFixed(0)}% · Eng ${a.eng.toFixed(0)}% · Var ${a.var.toFixed(0)}%</small>`;
function chapAll(kind,on){let c=data[view.subject].papers[view.paper].chapters[view.chapter],nm=kind==="class"?"Class":"Concept Note",ix=kind==="class"?0:1;c.topics.forEach(t=>{let x=t.tasks.find(y=>y.name===nm);if(x)x.done=on});routines.forEach(r=>{if(!r.id)return;let a=r.id.split("|").map(Number);if(a[0]===view.subject&&a[1]===view.paper&&a[2]===view.chapter&&a[4]===ix)r.done=on});save();saveRoutine();render()}
function topicTasksX(t){let g=tg(t),row=n=>{let i=t.tasks.findIndex(x=>x.name===n),x=t.tasks[i];return x?`<label class="task"><input type="checkbox" ${x.done?"checked":""} onchange="toggleTask(${i},this.checked)"><span class="${x.done?"done":""}">${esc(n)}</span>${x.weight<100?`<b>${x.weight}%</b>`:""}</label>`:""},tp=topicProgress(t);
return `<div class="row"><small>Topic progress</small><b>${tp.toFixed(0)}%</b></div><div class="bar"><i style="width:${tp}%"></i></div><div class="sec"><div class="row"><b>Class ও Concept Note</b><span class="pill">${((g.class+g.note)/2).toFixed(0)}%</span></div>${row("Class")}${row("Concept Note")}</div><div class="sec"><div class="row"><b>Practice · Engineering</b><span class="pill">${g.eng}%</span></div><small class="muted">Engineering MCQ</small><div class="bar sm"><i style="width:${g.eng}%"></i></div>${row("EQB")}${row("CB")}${row("PB")}</div><div class="sec"><div class="row"><b>Practice · Varsity</b><span class="pill">${g.var}%</span></div><small class="muted">Varsity MCQ</small><div class="bar sm"><i style="width:${g.var}%"></i></div>${row("VQB")}${row("অনুশীলনী")}</div>`}
function lvl(){migrateV2();let el=document.getElementById("app"),p=view.page,allC=()=>data.flatMap(s=>s.papers.flatMap(q=>q.chapters));
if(p==="home"){let c0=el.querySelector(".card");if(c0)c0.insertAdjacentHTML("beforeend",brkX(aggCh(allC())));el.querySelectorAll(".grid>.card[onclick]").forEach((c,i)=>{let b=c.querySelector(".bar");if(b&&data[i])b.insertAdjacentHTML("afterend",miniX(aggCh(data[i].papers.flatMap(q=>q.chapters))))})}
else if(p==="subject"){let c0=el.querySelector(".card");if(c0)c0.insertAdjacentHTML("beforeend",brkX(aggCh(data[view.subject].papers.flatMap(q=>q.chapters))))}
else if(p==="chapter"){let c=data[view.subject].papers[view.paper].chapters[view.chapter],a=aggT(c.topics),N=c.topics.length,c0=el.querySelector(".card");
if(c0)c0.innerHTML=`<small>Chapter progress</small><div class="big">${a.all.toFixed(1)}%</div><div class="bar"><i style="width:${a.all}%"></i></div>${brkX(a)}<div class="sec"><label class="task"><input type="checkbox" ${N&&a.cd===N?"checked":""} ${N?"":"disabled"} onchange="chapAll('class',this.checked)"><span>Class done (সব topic)</span><b>${a.cd}/${N}</b></label><label class="task"><input type="checkbox" ${N&&a.nd===N?"checked":""} ${N?"":"disabled"} onchange="chapAll('note',this.checked)"><span>Concept Note done (সব topic)</span><b>${a.nd}/${N}</b></label></div>`;
el.querySelectorAll(".list>.item").forEach((it,i)=>{let t=c.topics[i];if(!t)return;let g=tg(t),b=it.querySelector(".bar");if(b)b.insertAdjacentHTML("afterend",`<div class="chips"><span class="cp ${g.class>=100?"y":""}">Class${g.class>=100?" ✔":""}</span><span class="cp ${g.note>=100?"y":""}">Note${g.note>=100?" ✔":""}</span><span class="cp ${g.eng>=100?"y":""}">Eng ${g.eng}%</span><span class="cp ${g.var>=100?"y":""}">Var ${g.var}%</span></div>`)})}
else if(p==="topic"){let t=data[view.subject].papers[view.paper].chapters[view.chapter].topics[view.topic],c0=el.querySelector(".card");if(c0&&t)c0.innerHTML=topicTasksX(t)}}
const _ins3=insights;insights=function(){let h=_ins3(),k='<h3 class="section-title">Subject-wise';return h.includes(k)?h.replace(k,'<h3 class="section-title">Progress breakdown</h3><div class="card">'+brkX(aggCh(data.flatMap(s=>s.papers.flatMap(q=>q.chapters))))+'</div>'+k):h};
const _render=render,_tt=toggleTask,_cr=completeRoutine,_bk=backup;
toggleTask=(i,v)=>{_tt(i,v);addLog(0,v?1:-1)};
completeRoutine=(i,v)=>{_cr(i,v);addLog(0,v?1:-1)};
backup=()=>{S.lastBackup=Date.now();saveS();_bk()};
render=function(){_render();let el=document.getElementById("app"),p=view.page,pill=document.getElementById("tpill");pill.style.display=T?"":"none";if(T)pill.textContent="⏱ "+fmt(T.left);
document.getElementById("menu").insertAdjacentHTML("beforeend",'<button onclick="go(\'insights\')">📊 Insights</button>');
if(p==="home"){[...el.querySelectorAll(".card")].find(c=>c.textContent.includes("Routine খুলুন"))?.remove();el.querySelector(".grid").insertAdjacentHTML("afterend",'<div style="margin-top:16px">'+homeX()+"</div>");el.querySelector("h2").id="mot";motApply()}
else if(p==="topic")el.querySelector("footer").insertAdjacentHTML("beforebegin",topicX());
else if(p==="routine")el.innerHTML=routineX();
else if(p==="insights")el.innerHTML=insights();
else if(p==="settings"){el.querySelector(".card").innerHTML=themePicker();el.insertAdjacentHTML("beforeend",settingsX());let dc=[...el.querySelectorAll(".card")].find(c=>c.textContent.includes("Data management"));if(dc)dc.innerHTML=dataX();el.insertAdjacentHTML("beforeend",quotesX())}
lvl();paint();tpBarRender();exhRender();};
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
